<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜bloom studio</title>
<style>
  :root{ --navy:#1B2A4A; --gold:#B99A5B; --ink:#2E3440; --sub:#6B7280; --line:#E3DDD2; --bg:#FDFCF9; --soft:#F5F2EB; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#EDEAE3; color:var(--ink); font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif; line-height:1.9; font-size:16px; }
  .wrap{ max-width:680px; margin:0 auto; background:var(--bg); min-height:100vh; }
  .head{ background:var(--navy); color:#fff; text-align:center; padding:34px 24px 30px; }
  .brand{ font-family:"Times New Roman",serif; letter-spacing:.24em; font-size:15px; }
  .brand small{ display:block; letter-spacing:.16em; font-size:10px; color:var(--gold); margin-top:6px; }
  .head .title{ font-family:"Times New Roman",serif; letter-spacing:.4em; font-size:26px; margin-top:20px; padding-left:.4em; }
  .body{ padding:38px 26px 44px; text-align:center; }
  .lead{ font-size:16px; color:var(--navy); line-height:2.05; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--sub); line-height:1.95; margin-top:14px; }
  .cta{ margin-top:30px; }
  .cta a{ display:inline-block; background:var(--gold); color:#fff; text-decoration:none; font-size:15px; letter-spacing:.08em; padding:14px 40px; border-radius:40px; }
  .note{ font-size:12px; color:var(--sub); margin-top:14px; }
  .steps{ border-top:1px solid var(--line); margin-top:34px; padding-top:22px; text-align:left; }
  .steps h2{ font-size:13px; font-weight:normal; color:var(--navy); letter-spacing:.12em; text-align:center; margin-bottom:14px; }
  .steps ol{ list-style:none; counter-reset:s; }
  .steps li{ counter-increment:s; position:relative; padding:8px 0 8px 34px; color:var(--ink); font-size:14px; border-bottom:1px dotted var(--line); }
  .steps li:last-child{ border-bottom:none; }
  .steps li::before{ content:counter(s); position:absolute; left:0; top:8px; width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; background:var(--navy); color:var(--gold); font-family:"Times New Roman",serif; font-size:12px; }
  .foot{ background:var(--navy); color:#c9cedb; text-align:center; font-size:11px; letter-spacing:.1em; padding:20px; }
  .foot .b{ font-family:"Times New Roman",serif; letter-spacing:.22em; color:#fff; font-size:13px; display:block; margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">bloom studio<small>DIRECTION / DESIGN</small></div>
    <div class="title">CONTACT</div>
  </div>
  <div class="body">
    <p class="lead">まだ頼む内容が決まっていなくても、<br>大丈夫です。</p>
    <p class="sub">事業の中身から、一緒に考えます。<br>「これってできる？」のご相談だけでも、お気軽にどうぞ。</p>

    <div class="cta"><a href="https://line.me/R/ti/p/%40541xvlrw">LINEで相談する</a></div>
    <p class="note">ボタンから公式LINEのトークにつながります。</p>

    <div class="steps">
      <h2>ご相談の流れ</h2>
      <ol>
        <li>LINEでご連絡（内容が未定でもOK）</li>
        <li>お話をうかがい、事業の中身を整理</li>
        <li>必要なサポートとお見積りをご提案</li>
      </ol>
    </div>
  </div>
  <div class="foot"><span class="b">bloom studio</span>AI・デザイン・ホームページ制作</div>
</div>
</body>
</html>
