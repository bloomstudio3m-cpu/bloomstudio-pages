<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おはよう 予告編｜Hwam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Cinzel:wght@700&display=block" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  canvas{ display:block; width:100vw; height:100vh; object-fit:contain; background:#000; }
  .replay{ position:fixed; right:16px; top:16px; background:rgba(0,0,0,.6); color:#f3d27a; border:1px solid #b98a2e;
    border-radius:999px; padding:8px 18px; font:12px/1 sans-serif; letter-spacing:.12em; cursor:pointer; display:none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button class="replay" id="replay" type="button">もう一回 ↻</button>

<script>
(function(){
  const C = document.getElementById("c"), X = C.getContext("2d");
  const W = 1920, H = 1080, BAR = 138, END = 26.5;
  const MINCHO = '"Shippori Mincho B1", serif', CINZEL = '"Cinzel", serif';

  const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (t, a, b) => cl((t - a) / (b - a));
  const eo = x => 1 - Math.pow(1 - x, 3);
  const win = (t, a, b, fi = .6, fo = .6) => Math.min(p(t, a, a + fi), 1 - p(t, b - fo, b));
  const rng = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // 衝撃（画面揺れ＋白フラッシュ）のタイミング
  const HITS = [[11.8, 22, .45], [15.6, 26, .9], [16.2, 26, .9], [16.8, 30, 1], [20.2, 12, .55]];

  function gold(size){
    const g = X.createLinearGradient(0, -size * .55, 0, size * .55);
    g.addColorStop(0, "#fff8dc"); g.addColorStop(.42, "#f3d27a");
    g.addColorStop(.55, "#b98a2e"); g.addColorStop(1, "#ffe7a3");
    return g;
  }

  function text(str, x, y, o){
    const size = o.size || 60, sp = o.spacing || 0;
    X.save();
    X.globalAlpha = o.alpha == null ? 1 : o.alpha;
    X.translate(x + sp / 2, y); X.scale(o.scale || 1, o.scale || 1);
    X.font = `${o.weight || 800} ${size}px ${o.font || MINCHO}`;
    X.letterSpacing = sp + "px"; X.textAlign = "center"; X.textBaseline = "middle";
    if(o.shadow){ X.shadowColor = o.shadow; X.shadowBlur = o.blur || 30; }
    X.fillStyle = o.gold ? gold(size) : (o.color || "#fff");
    X.fillText(str, 0, 0);
    X.restore();
  }

  // 暗いシーン用：星とチリ
  function night(t, a){
    const g = X.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#02030a"); g.addColorStop(1, "#0b1733");
    X.globalAlpha = a; X.fillStyle = g; X.fillRect(0, 0, W, H);
    for(let i = 0; i < 180; i++){
      const tw = .25 + .75 * Math.abs(Math.sin(t * 1.3 + i * 1.7));
      X.globalAlpha = a * tw * .8; X.fillStyle = "#cfe0ff";
      X.fillRect(rng(i) * W, rng(i + 500) * H * .8, 2, 2);
    }
    for(let i = 0; i < 50; i++){
      const x = (rng(i + 900) * W + t * 18 * (rng(i + 950) - .3)) % W;
      const y = (rng(i + 1000) * H - t * 10 * rng(i + 1050) + H) % H;
      X.globalAlpha = a * .25; X.fillStyle = "#fff";
      X.beginPath(); X.arc(x, y, 1 + rng(i + 1100) * 2.5, 0, Math.PI * 2); X.fill();
    }
    X.globalAlpha = 1;
  }

  // 映倫カード風
  function ratingCard(t){
    const a = win(t, 0, 2.7, .3, .4);
    if(a <= 0) return;
    X.globalAlpha = a;
    X.fillStyle = "#0f5f31"; X.fillRect(0, 0, W, H);
    X.strokeStyle = "#e8f2e8"; X.lineWidth = 4; X.strokeRect(260, 230, W - 520, H - 460);
    X.globalAlpha = 1;
    text("THE FOLLOWING PREVIEW HAS BEEN APPROVED FOR", W/2, 330, { size: 38, font: CINZEL, weight: 700, spacing: 4, alpha: a });
    text("ALL MORNINGS", W/2, 410, { size: 64, font: CINZEL, weight: 700, spacing: 10, alpha: a });
    text("この予告編は、すべての朝にふさわしいと認められました", W/2, 520, { size: 40, spacing: 4, alpha: a });
    X.globalAlpha = a; X.strokeRect(560, 620, W - 1120, 150); X.globalAlpha = 1;
    text("RATED G — GOOD MORNING", W/2, 695, { size: 44, font: CINZEL, weight: 700, spacing: 6, alpha: a });
  }

  // 「Hwam PRESENTS」：金文字に光が走る
  const off = document.createElement("canvas"); off.width = W; off.height = 420;
  const O = off.getContext("2d");
  function presents(t){
    const a = win(t, 3.0, 6.1, .9, .7);
    if(a <= 0) return;
    const s = 1 + p(t, 3.0, 6.1) * .06;
    O.clearRect(0, 0, W, 420);
    O.save(); O.translate(W/2 + 13, 190); O.scale(s, s);
    O.font = `700 190px ${CINZEL}`; O.letterSpacing = "26px"; O.textAlign = "center"; O.textBaseline = "middle";
    const g = O.createLinearGradient(0, -100, 0, 100);
    g.addColorStop(0, "#fff8dc"); g.addColorStop(.42, "#f3d27a"); g.addColorStop(.55, "#a87a22"); g.addColorStop(1, "#ffe7a3");
    O.fillStyle = g; O.fillText("Hwam", 0, 0);
    O.restore();
    // 光のスイープ
    const sx = -600 + p(t, 3.6, 5.2) * (W + 1200);
    O.globalCompositeOperation = "source-atop";
    const sg = O.createLinearGradient(sx - 160, 0, sx + 160, 0);
    sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, "rgba(255,255,255,.95)"); sg.addColorStop(1, "rgba(255,255,255,0)");
    O.fillStyle = sg; O.fillRect(0, 0, W, 420);
    O.globalCompositeOperation = "source-over";
    X.save(); X.globalAlpha = a; X.shadowColor = "rgba(243,210,122,.45)"; X.shadowBlur = 40;
    X.drawImage(off, 0, H/2 - 250); X.restore();
    text("P R E S E N T S", W/2, H/2 + 150, { size: 36, font: CINZEL, weight: 700, spacing: 14, color: "#d9c28a", alpha: a * p(t, 4.0, 4.8) });
    // 横に走るフレア
    const fl = Math.sin(Math.PI * p(t, 3.6, 5.2));
    const fg = X.createLinearGradient(0, 0, W, 0);
    fg.addColorStop(0, "rgba(120,170,255,0)"); fg.addColorStop(.5, `rgba(200,225,255,${.7 * fl * a})`); fg.addColorStop(1, "rgba(120,170,255,0)");
    X.fillStyle = fg; X.fillRect(0, H/2 - 60, W, 3);
  }

  // 静かなテロップ
  function caption(t, str, a0, a1, size){
    const a = win(t, a0, a1, .8, .7);
    if(a <= 0) return;
    const s = 1 + p(t, a0, a1) * .05;
    text(str, W/2, H/2, { size: size || 84, spacing: 14, alpha: a, scale: s, shadow: "rgba(150,190,255,.35)", blur: 40 });
  }

  // 叩きつけるテロップ
  function slam(t, str, a0, a1, size, isGold){
    if(t < a0 || t > a1) return;
    const k = eo(p(t, a0, a0 + .18));
    const s = 1.6 - .6 * k + p(t, a0 + .18, a1) * .04;
    const a = Math.min(k * 1.4, 1 - p(t, a1 - .08, a1));
    text(str, W/2, H/2, { size, spacing: 10, alpha: a, scale: s, gold: isGold, shadow: "rgba(255,255,255,.35)", blur: 30 });
  }

  // 夜明け：地平線に光がにじむ
  function dawn(t){
    if(t < 18.2 || t > 20.2) return;
    const k = Math.pow(p(t, 18.2, 20.1), 1.6), y0 = 650;
    X.fillStyle = "#000"; X.fillRect(0, 0, W, H);
    const sky = X.createLinearGradient(0, 0, 0, y0);
    sky.addColorStop(0, "rgba(0,0,0,0)"); sky.addColorStop(.55, `rgba(40,70,110,${.45 * k})`);
    sky.addColorStop(.88, `rgba(230,130,70,${.8 * k})`); sky.addColorStop(1, `rgba(255,210,150,${k})`);
    X.fillStyle = sky; X.fillRect(0, 0, W, y0);
    // 地平線の光の芯（横長）
    X.save(); X.translate(W/2, y0); X.scale(4, 1);
    const core = X.createRadialGradient(0, 0, 0, 0, 0, 220);
    core.addColorStop(0, `rgba(255,248,230,${k})`); core.addColorStop(.35, `rgba(255,190,110,${.7 * k})`); core.addColorStop(1, "rgba(255,120,60,0)");
    X.fillStyle = core; X.fillRect(-500, -220, 1000, 440); X.restore();
    // 山なみのシルエット
    X.fillStyle = "#040507"; X.beginPath(); X.moveTo(0, H);
    for(let x = 0; x <= W; x += 20) X.lineTo(x, y0 + 14 + Math.sin(x * .004) * 18 + Math.sin(x * .011 + 1) * 8);
    X.lineTo(W, H); X.closePath(); X.fill();
    streak(y0, .9 * k);
    text("夜が、明ける。", W/2, 380, { size: 72, spacing: 20, alpha: win(t, 18.5, 20.2, .8, .3), shadow: "rgba(255,190,120,.3)", blur: 30 });
  }

  // アナモルフィックの横フレア
  function streak(y, a){
    if(a <= .01) return;
    X.save(); X.globalCompositeOperation = "lighter";
    const g = X.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, "rgba(90,150,255,0)"); g.addColorStop(.5, `rgba(200,225,255,${a})`); g.addColorStop(1, "rgba(90,150,255,0)");
    X.fillStyle = g; X.fillRect(0, y - 1.5, W, 3);
    const g2 = X.createLinearGradient(0, 0, W, 0);
    g2.addColorStop(0, "rgba(60,120,255,0)"); g2.addColorStop(.5, `rgba(120,170,255,${a * .25})`); g2.addColorStop(1, "rgba(60,120,255,0)");
    X.fillStyle = g2; X.fillRect(0, y - 14, W, 28);
    X.restore();
  }

  // タイトル「おはよう。」：ボケ→ピント、光が走る
  const TT = document.createElement("canvas"); TT.width = W; TT.height = 520;
  const T = TT.getContext("2d");
  function title(t){
    if(t < 20.2) return;
    const r = eo(p(t, 20.2, 21.8));
    const ty = 470;
    // 背後の逆光
    const bl = X.createRadialGradient(W/2, ty, 0, W/2, ty, 900);
    bl.addColorStop(0, `rgba(120,80,40,${.35 * r})`); bl.addColorStop(1, "rgba(0,0,0,0)");
    X.fillStyle = bl; X.fillRect(0, 0, W, H);
    // 舞うチリ
    for(let i = 0; i < 60; i++){
      const x = (rng(i + 3000) * W + (t - 20.2) * 14 * (rng(i + 3100) - .5) * 2 + W) % W;
      const y = (rng(i + 3200) * H - (t - 20.2) * 8 * rng(i + 3300) + H) % H;
      X.globalAlpha = r * .35 * (.4 + .6 * Math.abs(Math.sin(t * .8 + i)));
      X.fillStyle = "#ffe2b0"; X.beginPath(); X.arc(x, y, .8 + rng(i + 3400) * 2.2, 0, Math.PI * 2); X.fill();
    }
    X.globalAlpha = 1;

    const sp = 34 + (1 - r) * 60;
    const sc = 1.1 - .1 * r + p(t, 21.8, END) * .03;
    T.clearRect(0, 0, W, 520);
    T.save(); T.translate(W/2 + sp / 2, 260); T.scale(sc, sc);
    T.font = `800 230px ${MINCHO}`; T.letterSpacing = sp + "px"; T.textAlign = "center"; T.textBaseline = "middle";
    T.fillStyle = "#3a2608"; T.fillText("おはよう。", 0, 5);
    const g = T.createLinearGradient(0, -120, 0, 120);
    g.addColorStop(0, "#fff6d8"); g.addColorStop(.35, "#e9c878"); g.addColorStop(.52, "#8a6420");
    g.addColorStop(.6, "#c9a24e"); g.addColorStop(1, "#f6e2a8");
    T.fillStyle = g; T.fillText("おはよう。", 0, 0);
    T.restore();
    // 光のスイープ
    const sx = -500 + p(t, 21.2, 22.6) * (W + 1000);
    T.globalCompositeOperation = "source-atop";
    const sg = T.createLinearGradient(sx - 220, 0, sx + 220, 0);
    sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, "rgba(255,252,240,.85)"); sg.addColorStop(1, "rgba(255,255,255,0)");
    T.fillStyle = sg; T.fillRect(0, 0, W, 520);
    T.globalCompositeOperation = "source-over";

    X.save();
    X.globalAlpha = r; X.filter = `blur(${(1 - r) * 22}px)`;
    X.shadowColor = `rgba(255,200,120,${.35 * r})`; X.shadowBlur = 50;
    X.drawImage(TT, 0, ty - 260);
    X.restore();

    streak(ty, .8 * Math.exp(-(t - 20.2) * 1.4) + .12 * r);

    // クレジット
    const c = eo(p(t, 22.8, 23.8));
    X.globalAlpha = c * .6; X.fillStyle = "#c9a24e"; X.fillRect(W/2 - 120, 700, 240, 1); X.globalAlpha = 1;
    text("Hwam", W/2, 760, { size: 50, font: CINZEL, weight: 700, spacing: 24, color: "#efe6d2", alpha: c });
    text("毎朝、全国一斉公開。", W/2, 830, { size: 30, spacing: 14, color: "#b9ad96", alpha: eo(p(t, 23.3, 24.3)) });
  }

  function draw(t){
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.globalAlpha = 1; X.globalCompositeOperation = "source-over";
    X.fillStyle = "#000"; X.fillRect(0, 0, W, H);

    // 画面揺れ
    let sx = 0, sy = 0, fl = 0;
    for(const [h, amp, f] of HITS){
      const dt = t - h; if(dt < 0) continue;
      const e = Math.exp(-dt * 7);
      sx += amp * e * Math.sin(dt * 90); sy += amp * e * Math.cos(dt * 77);
      fl += f * Math.exp(-dt * 11);
    }
    X.setTransform(1, 0, 0, 1, sx, sy);

    ratingCard(t);
    presents(t);
    const na = Math.min(win(t, 6.2, 17.4, .8, .3), 1 - p(t, 18.2, 19.0));
    if(na > 0) night(t, na);
    caption(t, "世界が、まだ眠っている頃——", 6.4, 9.2);
    caption(t, "誰もが、布団と戦っていた。", 9.4, 11.6);
    slam(t, "アラーム、5回目。", 11.8, 13.4, 110, false);
    caption(t, "それでも——", 13.6, 15.4, 96);
    slam(t, "今、", 15.6, 16.15, 200, false);
    slam(t, "まぶたが", 16.2, 16.75, 200, false);
    slam(t, "開く。", 16.8, 17.4, 230, true);
    text("……", W/2, H/2, { size: 70, alpha: win(t, 17.5, 18.3, .2, .2), color: "#8894aa" });
    dawn(t);
    title(t);

    X.setTransform(1, 0, 0, 1, 0, 0);
    // 白フラッシュ
    if(fl > .01){ X.globalAlpha = cl(fl); X.fillStyle = "#fff"; X.fillRect(0, 0, W, H); X.globalAlpha = 1; }
    // ビネット
    const vg = X.createRadialGradient(W/2, H/2, H * .35, W/2, H/2, W * .62);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.6)");
    X.fillStyle = vg; X.fillRect(0, 0, W, H);
    // フィルムグレイン
    const fr = Math.floor(t * 24);
    X.fillStyle = "#fff";
    for(let i = 0; i < 900; i++){
      X.globalAlpha = .05;
      X.fillRect(rng(fr * 1000 + i) * W, rng(fr * 1000 + i + 77777) * H, 2, 2);
    }
    X.globalAlpha = 1;
    // ラストは黒へ
    const fo = p(t, END - .9, END);
    if(fo > 0){ X.globalAlpha = fo; X.fillStyle = "#000"; X.fillRect(0, 0, W, H); X.globalAlpha = 1; }
    // シネスコの黒帯
    X.fillStyle = "#000"; X.fillRect(0, 0, W, BAR); X.fillRect(0, H - BAR, W, BAR);
  }

  const ALL = "この予告編は、すべての朝にふさわしいと認められました世界が、まだ眠っている頃——誰もが、布団と戦っていた。アラーム、5回目。それでも——今、まぶたが開く。……夜が、明ける。おはよう。毎朝、全国一斉公開。";
  const ready = Promise.all([
    document.fonts.load(`800 100px "Shippori Mincho B1"`, ALL),
    document.fonts.load(`700 100px Cinzel`, "THE FOLLOWING PREVIEW HAS BEEN APPROVED FOR ALL MORNINGS RATED G — GOOD MORNING Hwam PRESENTS"),
  ]).catch(() => {});

  const capture = new URLSearchParams(location.search).has("capture");
  if(capture){
    window.ready = ready;
    window.renderAt = draw;
  } else {
    ready.then(() => {
      let t0 = null;
      (function loop(now){
        if(t0 === null) t0 = now;
        const t = (now - t0) / 1000;
        draw(Math.min(t, END));
        if(t < END) requestAnimationFrame(loop);
        else document.getElementById("replay").style.display = "block";
      })(performance.now());
    });
    document.getElementById("replay").addEventListener("click", () => location.reload());
  }
})();
</script>
</body>
</html>
