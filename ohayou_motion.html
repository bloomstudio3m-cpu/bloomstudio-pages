<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おはようございます｜Hwam</title>
<style>
  :root{ --navy:#1B2A4A; --gold:#B99A5B; --sun1:#FFE27A; --sun2:#FF9A3C; --pink:#FF5E8A; --sky1:#2B1B5A; --sky2:#FF7A59; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#0d0a1f; overflow:hidden; font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic","Hiragino Sans",sans-serif; }

  .stage{ position:relative; width:100vw; height:100vh; overflow:hidden;
    background:linear-gradient(180deg,#140c33 0%,#2b1b5a 45%,#5a2a6e 70%,#ff7a59 100%); }
  .stage::before{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,#5ec8ff 0%,#9be3ff 40%,#ffe7a8 80%,#ffb36b 100%);
    opacity:0; animation:dawn 2.4s .3s ease-out forwards; }

  canvas{ position:absolute; inset:0; width:100%; height:100%; }

  /* 太陽と放射光 */
  .sun-wrap{ position:absolute; left:50%; top:58%; width:0; height:0; }
  .rays{ position:absolute; left:50%; top:50%; width:260vmax; height:260vmax; margin:-130vmax 0 0 -130vmax;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.55) 0deg 6deg, rgba(255,255,255,0) 6deg 18deg);
    -webkit-mask:radial-gradient(circle, #000 0%, #000 12%, transparent 48%);
            mask:radial-gradient(circle, #000 0%, #000 12%, transparent 48%);
    opacity:0; transform:scale(.2) rotate(0deg);
    animation:raysIn 1.2s 1.1s cubic-bezier(.2,1.4,.4,1) forwards, spin 24s 1.1s linear infinite; }
  .sun{ position:absolute; left:50%; top:50%; width:34vmin; height:34vmin; margin:-17vmin 0 0 -17vmin; border-radius:50%;
    background:radial-gradient(circle at 40% 38%, #fffbe0 0%, var(--sun1) 35%, var(--sun2) 75%, #ff6a3c 100%);
    box-shadow:0 0 60px 20px rgba(255,210,90,.8), 0 0 160px 80px rgba(255,140,60,.45);
    transform:translateY(60vh) scale(.6); animation:sunrise 1.6s .2s cubic-bezier(.2,1.2,.3,1) forwards, pulse 2.2s 2s ease-in-out infinite; }
  .ring{ position:absolute; left:50%; top:50%; width:34vmin; height:34vmin; margin:-17vmin 0 0 -17vmin; border-radius:50%;
    border:4px solid rgba(255,255,255,.9); opacity:0; }
  .ring.r1{ animation:shock 1.4s 1.3s ease-out forwards; }
  .ring.r2{ animation:shock 1.4s 1.55s ease-out forwards; border-color:rgba(255,94,138,.9); }
  .ring.r3{ animation:shock 1.4s 1.8s ease-out forwards; border-color:rgba(255,226,122,.9); }

  /* 白フラッシュ */
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; animation:flash .7s 1.25s ease-out forwards; }

  /* メインコピー */
  .copy{ position:absolute; left:0; right:0; top:22%; text-align:center; pointer-events:none; }
  .line{ display:inline-flex; gap:.02em; font-weight:900; font-size:min(13vw,120px); line-height:1.1; letter-spacing:.02em; }
  .line.l2{ font-size:min(9.5vw,86px); }
  .ch{ display:inline-block; color:#fff; opacity:0;
    -webkit-text-stroke:.06em var(--navy); paint-order:stroke fill;
    text-shadow:.06em .08em 0 var(--pink), .12em .16em 0 var(--navy), 0 0 30px rgba(255,255,255,.6);
    transform:translateY(-120vh) rotate(-30deg) scale(2);
    animation:drop .7s cubic-bezier(.2,1.6,.4,1) forwards, bob 1.6s ease-in-out infinite; }
  .ch.gold{ color:var(--sun1); }
  .ch.pink{ color:#fff0f5; }

  .sub{ margin-top:3vh; display:inline-block; padding:.5em 1.6em; border-radius:999px;
    background:var(--navy); color:#fff; font-size:min(4.2vw,26px); font-weight:700; letter-spacing:.18em;
    border:3px solid var(--gold); box-shadow:0 8px 0 rgba(0,0,0,.25);
    opacity:0; transform:scale(0) rotate(-8deg); animation:popIn .6s 3.4s cubic-bezier(.2,1.8,.4,1) forwards; }
  .sub b{ color:var(--sun1); }

  .brand{ position:absolute; left:0; right:0; bottom:4vh; text-align:center; color:var(--navy); font-family:"Times New Roman",serif; font-weight:bold;
    letter-spacing:.3em; padding-left:.3em; font-size:min(7vw,32px); opacity:0; animation:fadeUp .8s 4s ease-out forwards; text-shadow:0 0 14px rgba(255,255,255,.95), 0 0 4px rgba(255,255,255,.9); }
  .brand small{ display:block; color:#7A5E28; letter-spacing:.24em; font-size:.42em; font-weight:normal; margin-top:2px; }

  .replay{ position:absolute; right:16px; top:16px; background:rgba(27,42,74,.75); color:#fff; border:1px solid var(--gold);
    border-radius:999px; padding:8px 16px; font-size:12px; letter-spacing:.1em; cursor:pointer; opacity:0; animation:fadeUp .6s 4.5s forwards; }

  /* 動画書き出し時：リールの下部UI（キャプション欄）に隠れない位置へ */
  .capture .brand{ bottom:21vh; font-size:min(8vw,40px); }
  @media (orientation: landscape){ .capture .brand{ bottom:5vh; } }

  @keyframes dawn{ to{ opacity:1; } }
  @keyframes sunrise{ to{ transform:translateY(0) scale(1); } }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  @keyframes raysIn{ to{ opacity:1; transform:scale(1) rotate(20deg); } }
  @keyframes spin{ from{ rotate:0deg; } to{ rotate:360deg; } }
  @keyframes shock{ 0%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(6); } }
  @keyframes flash{ 0%{ opacity:.9; } 100%{ opacity:0; } }
  @keyframes drop{
    0%{ opacity:1; transform:translateY(-120vh) rotate(-30deg) scale(2); }
    70%{ transform:translateY(4%) rotate(4deg) scale(.9,1.15); }
    85%{ transform:translateY(-6%) rotate(-2deg) scale(1.1,.9); }
    100%{ opacity:1; transform:translateY(0) rotate(0) scale(1); } }
  @keyframes bob{ 0%,100%{ translate:0 0; } 50%{ translate:0 -.08em; } }
  @keyframes popIn{ to{ opacity:1; transform:scale(1) rotate(-3deg); } }
  @keyframes fadeUp{ from{ opacity:0; translate:0 10px; } to{ opacity:1; translate:0 0; } }

  @media (prefers-reduced-motion: reduce){
    *,*::before{ animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sun-wrap">
    <div class="rays"></div>
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="sun"></div>
  </div>
  <canvas id="fx"></canvas>
  <div class="flash"></div>

  <div class="copy">
    <div class="line l1" id="l1"></div><br>
    <div class="line l2" id="l2"></div><br>
    <div class="sub">今日も<b>いい一日</b>を！</div>
  </div>

  <div class="brand">Hwam<small>GOOD MORNING</small></div>
  <button class="replay" id="replay" type="button">もう一回 ↻</button>
</div>

<script>
(function(){
  // 文字を1字ずつ落とす
  const L1 = "おはよう", L2 = "ございます！";
  const colors = ["", "gold", "pink"];
  function build(el, text, startDelay){
    el.innerHTML = "";
    [...text].forEach((c, i) => {
      const s = document.createElement("span");
      s.className = "ch " + colors[i % 3];
      s.textContent = c;
      const d = startDelay + i * 0.11;
      s.style.animationDelay = d + "s, " + (d + 0.8 + i * 0.07) + "s";
      el.appendChild(s);
    });
  }
  build(document.getElementById("l1"), L1, 1.5);
  build(document.getElementById("l2"), L2, 2.1);

  // パーティクル（紙吹雪＋キラキラ＋花火）
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  let W, H, dpr, parts = [], t0 = performance.now();
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener("resize", resize);

  const pal = ["#FFE27A","#FF9A3C","#FF5E8A","#5EC8FF","#B99A5B","#ffffff","#8B5CF6","#34D399"];
  const rnd = (a,b) => a + Math.random() * (b - a);

  function burst(x, y, n, power){
    for(let i=0;i<n;i++){
      const a = rnd(0, Math.PI*2), v = rnd(power*.3, power);
      parts.push({ kind:"spark", x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rnd(50,90), age:0,
        c:pal[i % pal.length], r:rnd(1.5,3.5) });
    }
  }
  function confetti(n){
    for(let i=0;i<n;i++){
      parts.push({ kind:"conf", x:rnd(0,W), y:rnd(-H*.6,-10), vx:rnd(-1,1), vy:rnd(2,5), rot:rnd(0,6), vr:rnd(-.2,.2),
        w:rnd(6,12), h:rnd(10,18), c:pal[i % pal.length], age:0, life:600, sway:rnd(0,6) });
    }
  }
  function twinkle(){
    parts.push({ kind:"star", x:rnd(0,W), y:rnd(0,H*.7), age:0, life:rnd(40,80), r:rnd(6,14), c:"#fff" });
  }

  // タイムライン
  let events;
  function schedule(){
    events = [
      { t:1.3, fn:() => burst(W/2, H*.58, 140, 14) },
      { t:2.0, fn:() => burst(W*.2, H*.3, 70, 9) },
      { t:2.3, fn:() => burst(W*.8, H*.25, 70, 9) },
      { t:2.9, fn:() => confetti(Math.round(W/6)) },
      { t:3.4, fn:() => burst(W*.5, H*.72, 90, 11) },
      { t:3.8, fn:() => { burst(W*.15, H*.7, 50, 8); burst(W*.85, H*.7, 50, 8); } },
    ];
  }
  schedule();

  function star(x,y,r,a){
    ctx.save(); ctx.translate(x,y); ctx.globalAlpha = a; ctx.fillStyle = "#fff";
    ctx.beginPath();
    for(let i=0;i<8;i++){ const rr = i%2 ? r*.18 : r; const an = i*Math.PI/4; ctx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr); }
    ctx.closePath(); ctx.shadowColor = "#FFE27A"; ctx.shadowBlur = 12; ctx.fill(); ctx.restore();
  }

  // 1ティック＝1/60秒ぶんのシミュレーション
  function tick(t){
    events = events.filter(e => { if(t >= e.t){ e.fn(); return false; } return true; });
    if(t > 2 && Math.random() < .25) twinkle();
    if(t > 5 && Math.random() < .02) burst(rnd(W*.1,W*.9), rnd(H*.1,H*.5), 40, 7);
    parts = parts.filter(p => p.age < p.life && p.y < H + 40);
    for(const p of parts){
      p.age++;
      if(p.kind === "spark"){ p.vx *= .96; p.vy = p.vy * .96 + .12; p.x += p.vx; p.y += p.vy; }
      else if(p.kind === "conf"){ p.x += p.vx + Math.sin((p.age + p.sway*20) / 15) * 1.2; p.y += p.vy; p.rot += p.vr; }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    for(const p of parts){
      if(p.kind !== "spark") continue;
      const k = 1 - p.age / p.life;
      ctx.globalAlpha = k; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + k), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    for(const p of parts){
      if(p.kind === "conf"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.age / 6));
        ctx.globalAlpha = 1; ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
      } else if(p.kind === "star"){
        star(p.x, p.y, p.r * Math.sin(Math.PI * p.age / p.life), Math.sin(Math.PI * p.age / p.life));
      }
    }
    ctx.globalAlpha = 1;
  }

  // ?capture のときは自動再生せず、動画書き出し用に時間を外から進める
  const capture = new URLSearchParams(location.search).has("capture");
  if(capture){
    document.getElementById("replay").style.display = "none";
    document.body.classList.add("capture");
    let ticks = 0;
    window.renderAt = function(sec){
      document.getAnimations().forEach(a => { a.pause(); a.currentTime = sec * 1000; });
      while(ticks < Math.round(sec * 60)){ tick(ticks / 60); ticks++; }
      draw();
    };
  } else {
    (function loop(now){
      tick((now - t0) / 1000);
      draw();
      requestAnimationFrame(loop);
    })(t0);
  }

  // もう一回
  document.getElementById("replay").addEventListener("click", () => location.reload());
})();
</script>
</body>
</html>
