<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Final Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=block" rel="stylesheet">
<style>
  :root{--bg:#0c0c0c;--fg:#ECE8DF;--mute:#8b877f;--acc:#FF4A1C}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",monospace}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box}
  canvas{display:block;width:min(100%,calc((100vh - 96px)*16/9));height:auto;aspect-ratio:16/9;background:#ECE8DF}
  .bar{width:min(100%,calc((100vh - 96px)*16/9));display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.08em}
  button{background:none;border:1px solid #3a3a3a;color:var(--fg);font:inherit;padding:6px 12px;cursor:pointer;min-width:72px}
  button:hover{border-color:var(--fg)}
  input[type=range]{flex:1;accent-color:var(--acc)}
  #tc{min-width:92px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
  body.render .bar{display:none}
  body.render #stage{padding:0}
  body.render canvas{width:1920px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;letter-spacing:.2em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="bar">
    <button id="play">PAUSE</button>
    <input id="scrub" type="range" min="0" max="15" step="0.001" value="0">
    <span id="tc">00:00:00</span>
  </div>
</div>
<div id="loading">LOADING…</div>
<script>
/* =====================================================================
   THE FINAL RECEIPT — 確定申告する犬
   15s / 1920x1080 / every frame is a pure function of t (seconds)
   ===================================================================== */
const W = 1920, H = 1080, DUR = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  paper: '#ECE8DF', paper2: '#E2DDD1', ink: '#141414', ink2: '#2A2A2A',
  red: '#FF4A1C', blue: '#2B4CFF', lime: '#C8FF2E', white: '#FBFAF6',
  fur: '#D18E4E', furL: '#DE9F60', furD: '#A9682F', cream: '#F5EBDD', earIn: '#F0D4B4',
  grey: '#B7B1A5', dark: '#141414',
};
const JP = '"Noto Sans JP"', LAT = 'Inter', MONO = '"IBM Plex Mono"';
const DESK = 230;

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const PI = Math.PI, TAU = PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  inOutSine: x => -(Math.cos(PI * x) - 1) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
};
const spring = (dt, f = 4, z = .35) => {
  if (dt <= 0) return 0;
  const w = TAU * f;
  return 1 - Math.exp(-z * w * dt) * Math.cos(w * Math.sqrt(1 - z * z) * dt);
};
const wobble = (dt, f = 5, z = .25) => dt <= 0 ? 0 : Math.exp(-z * TAU * f * dt) * Math.sin(TAU * f * dt);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');

/* ---------- timeline ---------- */
const ITEMS = [
  [0, 'ロゴ制作 報酬', 88000], [1, 'ドッグフード', 6480], [1, 'トリミング', 8800],
  [0, '撮影モデル料', 30000], [2, '骨（高級）', 12000], [1, 'おやつ（業務用）', 2980],
  [0, 'SNS案件', 55000], [2, 'ボール ×12', 3600], [1, 'リード新調', 4200],
  [1, 'ペット保険', 3920], [0, '散歩代行', 3000], [2, 'ふわふわ枕', 8900],
  [1, '肉球クリーム', 1650], [2, '謎の領収書', 0], [2, '？？？', 0],
];
const PREFILL = [[1, 'シャンプー', 2400], [0, '肖像使用料', 20000], [1, '爪切り', 1280]];
// accelerating beats = speed ramp into the hard stop at 7.0
const BEATS = [3.25, 3.72, 4.15, 4.54, 4.9, 5.22, 5.5, 5.75, 5.97, 6.17, 6.35, 6.51, 6.65, 6.78, 6.9];
const CAT_JP = ['売上', '経費', '？？？'];
const CAT_EN = ['REVENUE', 'EXPENSE', 'UNKNOWN'];
const CAT_BG = [C.blue, C.red, C.ink];
const CAT_FG = [C.white, C.white, C.lime];
const beatIndex = t => { let k = -1; for (let i = 0; i < BEATS.length; i++) if (t >= BEATS[i]) k = i; return k; };
const T_FREEZE = 7.0, T_SHUT = 7.25, T_DARK = 7.6, T_RESTART = 11.0, T_CONV = 11.55, T_TITLE = 12.85;

/* ---------- camera ---------- */
let CAM = { x: 0, y: 0, z: 1, sx: 0, sy: 0 };
function camera(t) {
  let x = 0, y = 0, z = 1, sx = 0, sy = 0;
  if (t < T_FREEZE) {
    z = lerp(1.12, 1.0, E.outCubic(seg(t, 0, 2.6))) + 0.06 * E.inCubic(seg(t, 3, 7));
    x = Math.sin(t * .7) * 12; y = Math.cos(t * .55) * 8;
    sy += wobble(t - .62, 7, .3) * 12;
    for (const b of BEATS) if (t >= b) { sx += wobble(t - b, 11, .35) * 5; sy += wobble(t - b, 9, .3) * 4; }
  } else if (t < T_DARK) {
    const f = camera(T_FREEZE - 1e-4); return { ...f, sx: 0, sy: 0 };
  } else if (t < T_RESTART) {
    const z0 = camera(T_FREEZE - 1e-4).z;
    z = lerp(z0, 1.15, E.inOutSine(seg(t, 7.6, 9.3))) + .1 * E.outExpo(seg(t, 9.35, 10.3)) + .015 * seg(t, 10.3, 11);
    x = 330 * E.inOutQuint(seg(t, 9.3, 10.05));
    y = -24 * E.inOutSine(seg(t, 7.6, 9.3));
  } else if (t < T_TITLE) {
    const k = E.outExpo(seg(t, 11, 11.45));
    z = lerp(1.265, 1.0, k) - .07 * E.inCubic(seg(t, 11.55, 12.85));
    x = lerp(330, 0, k) + Math.sin(t * .7) * 8; y = lerp(-24, 0, k);
    sx += wobble(t - 11, 12, .3) * 16; sy += wobble(t - 11, 10, .3) * 14;
  } else {
    z = lerp(1.07, 1.0, E.outCubic(seg(t, 12.85, 13.7))) + .025 * E.inOutSine(seg(t, 13.7, 15));
    sx += wobble(t - 12.85, 12, .3) * 18; sy += wobble(t - 12.85, 10, .3) * 16;
    sx += wobble(t - 13.97, 12, .35) * 6; sy += wobble(t - 13.97, 14, .35) * 10;
  }
  return { x, y, z, sx, sy };
}
function L(d, fn) {
  ctx.save();
  const z = 1 + (CAM.z - 1) * d;
  ctx.translate(W / 2 + CAM.sx * d, H / 2 + CAM.sy * d);
  ctx.scale(z, z);
  ctx.translate(-CAM.x * d, -CAM.y * d);
  fn();
  ctx.restore();
}
const toScreen = (wx, wy, d = 1) => {
  const z = 1 + (CAM.z - 1) * d;
  return [W / 2 + CAM.sx * d + z * (wx - CAM.x * d), H / 2 + CAM.sy * d + z * (wy - CAM.y * d)];
};

/* ---------- drawing helpers ---------- */
function font(w, s, f) { ctx.font = `${w} ${s}px ${f}`; }
function text(s, x, y, { w = 400, size = 16, f = MONO, col = C.ink, align = 'left', base = 'alphabetic', track = 0, alpha = 1 } = {}) {
  ctx.save();
  font(w, size, f); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = track + 'px'; ctx.globalAlpha *= alpha;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, TAU); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
// mask-rise text reveal (each char rises out of its own box)
function riseText(str, x, y, size, p, { w = 900, f = JP, col = C.ink, stagger = .08, dur = .55, colorFn = null, track = 0 } = {}) {
  font(w, size, f);
  ctx.save(); ctx.letterSpacing = track + 'px';
  let cx = x;
  const chars = [...str];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    const cw = ctx.measureText(ch).width + track;
    const q = E.outExpo(clamp((p - i * stagger) / dur));
    if (q > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(cx - 4, y - size * 1.05, cw + 8, size * 1.35); ctx.clip();
      ctx.fillStyle = colorFn ? colorFn(i, ch) : col;
      ctx.textBaseline = 'alphabetic';
      ctx.translate(cx, y + (1 - q) * size * 1.2);
      ctx.rotate((1 - q) * .12);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    cx += cw;
  }
  ctx.restore();
  return cx - x;
}

/* ---------- receipt art (pre-rendered) ---------- */
function zigPath(c, w, h, z = 7, top = true, bottom = true) {
  const n = Math.max(3, Math.round(w / (z * 2)));
  const x0 = -w / 2, y0 = -h / 2, dx = w / n;
  c.beginPath(); c.moveTo(x0, y0);
  for (let i = 0; i < n; i++) { if (top) c.lineTo(x0 + (i + .5) * dx, y0 + z); c.lineTo(x0 + (i + 1) * dx, y0); }
  c.lineTo(-x0, -y0);
  for (let i = n - 1; i >= 0; i--) { if (bottom) c.lineTo(x0 + (i + .5) * dx, -y0 - z); c.lineTo(x0 + i * dx, -y0); }
  c.closePath();
}
function makeReceiptImg(w, h, seed, big) {
  const pad = 30, cc = document.createElement('canvas');
  cc.width = Math.ceil(w + pad * 2); cc.height = Math.ceil(h + pad * 2);
  const c = cc.getContext('2d'), r = rng(seed);
  c.translate(cc.width / 2, cc.height / 2);
  c.save(); c.translate(5, 9); zigPath(c, w, h, w * .03 + 2); c.fillStyle = 'rgba(20,20,20,.13)'; c.fill(); c.restore();
  zigPath(c, w, h, w * .03 + 2); c.fillStyle = C.white; c.fill();
  const u = w / 120, x0 = -w / 2 + 12 * u, x1 = w / 2 - 12 * u;
  let y = -h / 2 + 18 * u;
  const hdr = r();
  if (hdr < .45) {
    c.fillStyle = C.ink; c.font = `600 ${11 * u}px ${MONO}`; c.textAlign = 'center';
    c.fillText(['RECEIPT', '領収書', 'レシート', 'INVOICE'][Math.floor(r() * 4)], 0, y + 8 * u); y += 18 * u;
  } else { c.fillStyle = C.ink; c.fillRect(-18 * u, y, 36 * u, 6 * u); y += 14 * u; }
  c.fillStyle = C.grey; c.fillRect(-26 * u, y, 52 * u, 2.5 * u); y += 12 * u;
  c.setLineDash([3 * u, 3 * u]); c.strokeStyle = C.grey; c.lineWidth = u; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.setLineDash([]); y += 10 * u;
  const rows = Math.floor((h / u - 110) / 11);
  for (let i = 0; i < rows; i++) {
    c.fillStyle = C.grey; c.fillRect(x0, y, (22 + r() * 34) * u, 3 * u);
    const rw = (12 + r() * 14) * u; c.fillRect(x1 - rw, y, rw, 3 * u); y += 11 * u;
  }
  y += 4 * u; c.fillStyle = C.ink; c.fillRect(x0, y, 30 * u, 5 * u); c.fillRect(x1 - 34 * u, y, 34 * u, 5 * u); y += 16 * u;
  // barcode
  let bx = x0; while (bx < x1) { const bw = (r() < .5 ? 1 : 2.2) * u; c.fillRect(bx, y, bw, 16 * u); bx += bw + (1 + r() * 2) * u; }
  if (r() < .28) { // stamp
    c.save(); c.translate((r() - .5) * 40 * u, (r() - .5) * 60 * u); c.rotate(-.3 + r() * .2);
    const col = r() < .6 ? C.red : C.blue;
    c.strokeStyle = col; c.globalAlpha = .75; c.lineWidth = 2 * u; c.beginPath(); c.arc(0, 0, 17 * u, 0, TAU); c.stroke();
    c.fillStyle = col; c.font = `900 ${12 * u}px ${JP}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(['済', '領収', '支払'][Math.floor(r() * 3)], 0, 1);
    c.restore();
  }
  return cc;
}

/* ---------- entities ---------- */
const RC = [];
{
  const r = rng(11);
  for (let i = 0; i < 48; i++) {
    const layer = i < 14 ? 0 : i < 40 ? 1 : 2;
    const depth = [.55, .85, 1.35][layer];
    const sc = [.62, .95, 2.0][layer] * (.85 + r() * .3);
    const w = 120 * sc, h = (170 + r() * 110) * sc;
    const start = layer === 2 ? .1 + (i - 40) * .3 + r() * .1 : .04 + Math.pow(r(), 1.5) * 2.3;
    const ang = r() * TAU;
    const from = { x: Math.cos(ang) * 1500, y: Math.sin(ang) * 950 };
    let tx, ty;
    do { tx = (r() * 2 - 1) * 900; ty = (r() * 2 - 1) * 470; } while (layer > 0 && Math.abs(tx) < 300 && ty > -440 && ty < 300);
    RC.push({
      i, k: i, layer, depth, w, h, start, dur: .45 + r() * .35, from, to: { x: tx, y: ty },
      rot0: (r() * 2 - 1) * 3.5, rot1: (r() * 2 - 1) * .45, spin: (r() * 2 - 1) * 5, fl: r() * TAU,
      bang: r() * TAU, brad: 500 + r() * 800, seed: (r() * 1e9) | 0, img: null,
    });
  }
  // belts for phase B
  const belts = [
    { y: -410, v: 70, tilt: .0, layer: 0 }, { y: 150, v: -55, tilt: 0, layer: 0 },
    { y: -330, v: -95, tilt: 0, layer: 1 }, { y: 420, v: 110, tilt: 0, layer: 1 },
  ];
  for (const b of belts) {
    const members = RC.filter((rc, idx) => rc.layer === b.layer && (idx % 2 === (belts.indexOf(b) % 2)));
    b.spacing = 2600 / members.length;
    members.forEach((rc, s) => { rc.belt = b; rc.slot = s; });
  }
}
function rcA(rc, t) {
  if (rc.layer === 2) {
    const p = seg(t, rc.start, rc.start + .5); if (p <= 0 || p >= 1) return null;
    const e = E.inOutSine(p);
    return { x: lerp(rc.from.x, -rc.from.x, e), y: lerp(rc.from.y * .8, -rc.from.y * .5, e), r: rc.rot0 + e * rc.spin * .4, s: 1, a: 1 };
  }
  const p = seg(t, rc.start, rc.start + rc.dur); if (p <= 0) return null;
  const e = E.outExpo(p), fl = t - rc.start;
  return {
    x: lerp(rc.from.x, rc.to.x, e) + Math.sin(fl * 1.3 + rc.fl) * 9 * e,
    y: lerp(rc.from.y, rc.to.y, e) + Math.cos(fl * 1.1 + rc.fl) * 7 * e,
    r: lerp(rc.rot0, rc.rot1, e) + Math.sin(fl * .9 + rc.fl) * .05, s: 1, a: 1,
  };
}
function beltPos(rc, t) {
  const b = rc.belt, span = 2600;
  let x = (rc.slot * b.spacing + b.v * (t - 3)) % span; if (x < 0) x += span;
  return { x: x - span / 2, y: b.y + Math.sin(t * 1.6 + rc.fl) * 5, r: Math.sin(t * 1.2 + rc.fl) * .03, s: 1, a: 1 };
}
function convergeState(o, t, ySq = .62) {
  const ang = o.bang, R = o.brad;
  if (t < T_CONV) {
    const e = E.outExpo(seg(t, T_RESTART, T_RESTART + .5));
    return { x: Math.cos(ang) * R * e, y: Math.sin(ang) * R * e * ySq, r: (o.rot0 || 0) * e * 1.5 + Math.sin(t * 3 + ang) * .1, s: .25 + .75 * e, a: 1 };
  }
  const c = E.inExpo(seg(t, T_CONV + (o.k || 0) * .004, 12.82));
  const a2 = ang + c * 2.4, rr = R * (1 - c);
  return { x: Math.cos(a2) * rr, y: Math.sin(a2) * rr * ySq, r: (o.rot0 || 0) * 1.5 + c * 7, s: (1 - c * .9), a: 1 - seg(c, .9, 1) };
}
function receiptState(rc, t) {
  if (t < 3) return rcA(rc, t);
  if (t < T_RESTART) {
    if (rc.layer === 2 || !rc.belt) return null;
    const a = rcA(rc, 3); if (!a) return null;
    const q = E.inOutQuint(seg(t, 3 + rc.k * .01, 3.62 + rc.k * .01));
    const b = beltPos(rc, t);
    return { x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), r: lerp(a.r, b.r, q), s: 1, a: 1 };
  }
  if (t >= T_TITLE) return null;
  return convergeState(rc, t);
}
function drawReceipts(t, layer, blurPx = 0) {
  const d = [.55, .85, 1.35][layer];
  L(d, () => {
    for (const rc of RC) {
      if (rc.layer !== layer) continue;
      const st = receiptState(rc, t); if (!st) continue;
      // motion blur via temporal ghosts
      const prev = receiptState(rc, t - 1 / 60);
      const sp = prev ? Math.hypot(st.x - prev.x, st.y - prev.y) : 0;
      const ghosts = sp > 14 ? 5 : 0;
      for (let g = ghosts; g >= 0; g--) {
        const s2 = g ? receiptState(rc, t - g * (1 / 240)) : st; if (!s2) continue;
        ctx.save();
        const dim = t >= 3 && t < T_RESTART ? lerp(1, layer === 0 ? .5 : .7, seg(t, 3, 3.6)) : 1;
        ctx.globalAlpha = (g ? .16 : 1) * s2.a * (layer === 0 ? .5 : 1) * dim;
        if (blurPx) ctx.filter = `blur(${blurPx}px)`;
        ctx.translate(s2.x, s2.y); ctx.rotate(s2.r); ctx.scale(s2.s, s2.s);
        ctx.drawImage(rc.img, -rc.img.width / 2, -rc.img.height / 2);
        ctx.restore();
      }
    }
  });
}

/* glyph particles */
const GL = [];
{
  const r = rng(29), chars = '¥¥¥¥%+−×÷=0123456789¥';
  for (let i = 0; i < 64; i++) {
    const ch = chars[Math.floor(r() * chars.length)];
    GL.push({
      ch, k: i, size: 18 + Math.pow(r(), 2) * 90, col: [C.ink, C.ink, C.red, C.blue][Math.floor(r() * 4)],
      depth: .6 + r() * .7, ang: r() * TAU, rad: 260 + r() * 700, t0: 1.0 + r() * .9,
      rot0: (r() - .5) * .6, bang: r() * TAU, brad: 400 + r() * 700, fl: r() * TAU, w: r() < .5 ? 900 : 400,
    });
  }
}
function glyphState(g, t) {
  if (t >= T_TITLE) return null;
  if (t >= T_RESTART) return convergeState(g, t);
  if (t < g.t0) return null;
  const e = E.outExpo(seg(t, g.t0, g.t0 + .8)), fl = t - g.t0;
  const cx = 0, cy = -60;
  return {
    x: cx + Math.cos(g.ang) * g.rad * e + Math.sin(fl * .8 + g.fl) * 14,
    y: cy + Math.sin(g.ang) * g.rad * e * .62 - fl * 10 * g.depth,
    r: g.rot0 * (1 - e) * 3 + Math.sin(fl + g.fl) * .08, s: .4 + .6 * e,
    a: lerp(1, .32, seg(t, 2.7, 3.4)),
  };
}
function drawGlyphs(t, front) {
  for (const g of GL) {
    if ((g.depth > 1) !== front) continue;
    const st = glyphState(g, t); if (!st) continue;
    L(g.depth, () => {
      ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.r); ctx.scale(st.s, st.s);
      ctx.globalAlpha = st.a;
      text(g.ch, 0, 0, { w: g.w, size: g.size, f: g.ch === '¥' || /\d/.test(g.ch) ? LAT : MONO, col: g.col, align: 'center', base: 'middle' });
      ctx.restore();
    });
  }
}

/* ---------- dog ---------- */
function dogState(t) {

    ctx.globalAlpha = .9 * a; ctx.strokeStyle = C.red; ctx.fillStyle = C.red;
    ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, 118, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 100, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.stroke();
    // ring text
    const str = 'FILED BY THE DOG ● 2026 ● FILED BY THE DOG ● 2026 ● ';
    font(700, 15, MONO);
    [...str].forEach((ch, i) => { ctx.save(); ctx.rotate(i / str.length * TAU); ctx.translate(0, -81); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 0); ctx.restore(); });
    // paw print
    ell(0, 14, 24, 19); ctx.fill();
    for (const [x, y, r] of [[-29, -14, 10], [-10, -32, 10.5], [10, -32, 10.5], [29, -14, 10]]) { ell(x, y, r * .85, r); ctx.fill(); }
    ctx.restore();
    // ink specks
    if (d > 0) {
      const r = rng(13);
      for (let i = 0; i < 14; i++) {
        const a2 = r() * TAU, rr = 130 + r() * 60 * E.outExpo(seg(d, 0, .3));
        ctx.fillStyle = C.red; ctx.globalAlpha = .7 * (1 - seg(d, .6, 1.2));
        ctx.beginPath(); ctx.arc(262 + Math.cos(a2) * rr, -262 + Math.sin(a2) * rr, 1 + r() * 3, 0, TAU); ctx.fill();
      }
    }
  });
}
function sceneTitle(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  drawGrid(t, C.ink, .07, seg(t, 12.85, 13.6));
  // shockwave
  const sw = seg(t, 12.85, 13.5);
  if (sw < 1) {
    const [cx, cy] = [W / 2, H / 2];
    ctx.strokeStyle = C.ink; ctx.lineWidth = 24 * (1 - sw); ctx.beginPath(); ctx.arc(cx, cy, E.outExpo(sw) * 1300, 0, TAU); ctx.stroke();
    ctx.strokeStyle = C.red; ctx.lineWidth = 10 * (1 - sw); ctx.beginPath(); ctx.arc(cx, cy, E.outExpo(seg(t, 12.9, 13.6)) * 1000, 0, TAU); ctx.stroke();
    if (t < 12.95) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx, cy, 40 * (1 - seg(t, 12.85, 12.95)), 0, TAU); ctx.fill(); }
  }
  // floating particles (parallax)
  const r = rng(51);
  for (let i = 0; i < 26; i++) {
    const d = .3 + r() * 1.2, bx = (r() - .5) * 2000, by = (r() - .5) * 1200, ch = '¥%+×0123'[Math.floor(r() * 8)], sz = 14 + r() * 40;
    const e = E.outExpo(seg(t, 12.9 + r() * .3, 13.8));
    L(d, () => text(ch, bx * (.6 + .4 * e), by * (.6 + .4 * e) - (t - 13) * 14 * d, { w: 900, size: sz, f: LAT, col: i % 5 === 0 ? C.red : C.ink, align: 'center', alpha: .22 * e }));
  }
  drawPlate(t);
  // title typography
  L(1, () => {
    const p = t - 13.12;
    text('— 令和8年分 —', 0, -208, { w: 700, size: 22, f: JP, col: C.ink, align: 'center', track: 10, alpha: E.outExpo(seg(t, 13.35, 13.7)) });
    if (p > 0) {
      font(900, 238, JP);
      const tw = ctx.measureText('確定申告').width + 3 * 6;
      riseText('確定申告', -tw / 2, 60, 238, p, { col: C.ink, stagger: .065, dur: .6, track: 6 });
    }
    // inverted band
    const b = E.inOutExpo(seg(t, 13.42, 13.82)), bw = 820, by = 124;
    if (b > 0) {
      ctx.fillStyle = C.ink; ctx.fillRect(-bw / 2, by, bw * b, 74);
      ctx.save(); ctx.beginPath(); ctx.rect(-bw / 2, by, bw * b, 74); ctx.clip();
      const tq = E.outExpo(seg(t, 13.55, 14.0));
      text('THE FINAL RECEIPT', 8, by + 52 + (1 - tq) * 40, { w: 800, size: 42, f: LAT, col: C.paper, align: 'center', track: 16 });
      ctx.restore();
      ctx.fillStyle = C.red; ctx.fillRect(-bw / 2 + bw * b - 8, by, 8 * (1 - seg(t, 13.8, 13.9)), 74);
    }
  });
  drawStamp(t);
  // micro captions
  const cap = E.outExpo(seg(t, 14.0, 14.5));
  text('A MOTION STUDY ON TAXES AND DOGS', 64, H - 60, { w: 500, size: 13, col: C.ink, track: 4, alpha: .7 * cap });
  text('申告期限 3/15 — 犬にも等しく訪れる。', W - 64, H - 60, { w: 700, size: 14, f: JP, col: C.ink, align: 'right', alpha: .7 * cap });
}

/* ---------- global overlays ---------- */
function hud(t, dark) {
  const col = dark ? C.paper : C.ink;
  const a = E.outExpo(seg(t, 0, .6));
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  const m = 40, s = 26;
  for (const [x, y, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [W - m, H - m, -1, -1], [m, H - m, 1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + dy * s); ctx.lineTo(x, y); ctx.lineTo(x + dx * s, y); ctx.stroke();
  }
  const frames = Math.floor(t * 60);
  const tc = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(frames % 60).padStart(2, '0')}`;
  text('THE FINAL RECEIPT', 84, 86, { w: 600, size: 14, col, track: 4 });
  text('確定申告 2026 / SHIBA-01', 84, 108, { w: 700, size: 13, f: JP, col, alpha: .55 });
  text(tc, W - 84, 86, { w: 500, size: 14, col, align: 'right', track: 2 });
  const frozen = t >= T_FREEZE && t < T_DARK;
  const recOn = frozen ? true : Math.floor(t * 2) % 2 === 0;
  ctx.fillStyle = frozen ? C.red : C.red; ctx.globalAlpha = a * (recOn ? 1 : .25);
  if (frozen) { ctx.fillRect(W - 250, 74, 5, 16); ctx.fillRect(W - 241, 74, 5, 16); }
  else { ctx.beginPath(); ctx.arc(W - 244, 81, 6, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = a;
  const status = t < 3 ? 'INGEST' : t < T_FREEZE ? 'SORTING' : t < T_RESTART ? 'HOLD' : t < T_TITLE ? 'RESUME' : 'FILED';
  text(status, W - 84, 108, { w: 600, size: 13, col: frozen || (t >= 7.6 && t < 11) ? C.red : col, align: 'right', track: 3 });
  // progress
  const prog = t < T_FREEZE ? Math.min(.97, t / 7.2) : t < T_RESTART ? .97 : t < T_TITLE ? lerp(.97, 1, seg(t, 11, 12.8)) : 1;
  ctx.fillStyle = col; ctx.globalAlpha = a * .2; ctx.fillRect(84, H - 84, 300, 2);
  ctx.globalAlpha = a; ctx.fillStyle = t >= 7.6 && t < 11 ? C.red : col; ctx.fillRect(84, H - 84, 300 * prog, 2);
  text(String(Math.floor(prog * 100)).padStart(2, '0') + '%', 396, H - 78, { w: 500, size: 12, col, alpha: .7 });
  text(`FRAME ${String(frames).padStart(4, '0')} / 0900`, W - 84, H - 78, { w: 400, size: 12, col, align: 'right', alpha: .6 });
  ctx.restore();
}
let GRAIN = null;
function makeGrain() {
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const g = GRAIN.getContext('2d'), id = g.createImageData(256, 256), r = rng(1);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
function post(t, dark) {
  ctx.save();
  const f = Math.floor(t * 60);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = dark ? .1 : .07;
  const pat = ctx.createPattern(GRAIN, 'repeat');
  ctx.translate((f * 71) % 256, (f * 131) % 256); ctx.fillStyle = pat; ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, dark ? 'rgba(0,0,0,.55)' : 'rgba(40,30,20,.16)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- frame ---------- */
function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  CAM = camera(t);
  let dark = false;
  if (t < T_SHUT) sceneMain(t < T_FREEZE ? t : T_FREEZE, t);
  else if (t < T_DARK) {
    sceneMain(T_FREEZE, t);
    // shutter: staggered bands close over the frozen frame
    const n = 9, bh = H / n;
    ctx.fillStyle = '#151515';
    for (let i = 0; i < n; i++) {
      const e = E.inOutExpo(seg(t, T_SHUT + i * .022, T_SHUT + .16 + i * .022));
      const dir = i % 2 ? -1 : 1;
      ctx.fillRect(dir > 0 ? 0 : W * (1 - e), i * bh - 1, W * e, bh + 2);
    }
    dark = t > 7.45;
  } else if (t < T_RESTART) { sceneDark(t); dark = true; }
  else if (t < T_TITLE) {
    if (t < 11.4) {
      sceneDark(t);
      const [hx, hy] = toScreen(0, -40);
      const r1 = E.outExpo(seg(t, 11, 11.22)) * 2300, r2 = E.outExpo(seg(t, 11.07, 11.36)) * 2300;
      ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(hx, hy, r1, 0, TAU); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, r2, 0, TAU); ctx.clip(); sceneReboot(t); ctx.restore();
      dark = r2 < 900;
    } else sceneReboot(t);
    // collapse flash
    const fl = seg(t, 12.78, 12.85);
    if (fl > 0) { ctx.fillStyle = C.ink; ctx.globalAlpha = fl; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  } else {
    sceneTitle(t);
    const fl = 1 - seg(t, 12.85, 12.93);
    if (fl > 0) { ctx.fillStyle = C.white; ctx.globalAlpha = fl * .9; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }
  hud(t, dark);
  post(t, dark);
}

/* ---------- boot + player ---------- */
const JPTEXT = '確定申告経費売上？、これ仕分け帳簿月次推移所得保留件要確認令和年分犬済領収書支払レシートワンマート代々木店国産鹿肉ジャーキー合計内消費税ご来店ありがとうございます申告期限にも等しく訪れる。ロゴ制作報酬ドッグフードトリミング撮影モデル料骨（高級）おやつ業務用SNS案件ボール×リード新調ペット保険散歩代行ふわふわ枕肉球クリーム謎のシャンプー肖像使用爪切り—＋0123456789／';
async function boot() {
  const loads = [];
  for (const w of [400, 700, 900]) loads.push(document.fonts.load(`${w} 40px "Noto Sans JP"`, JPTEXT));
  for (const w of [400, 600, 800, 900]) loads.push(document.fonts.load(`${w} 40px Inter`, 'THE FINAL RECEIPT ¥%+−×÷=0123456789READY'));
  for (const w of [400, 500, 600, 700]) loads.push(document.fonts.load(`${w} 40px "IBM Plex Mono"`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789¥%+−×÷=∑:.#/★●—()-, '));
  try { await Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 8000))]); } catch (e) {}
  for (const rc of RC) rc.img = makeReceiptImg(rc.w, rc.h, rc.seed, rc.layer === 2);
  MINI.img = makeReceiptImg(120, 200, 424242, false);
  makeGrain();
  document.getElementById('loading').remove();
  window.__ready = true;
}
window.renderFrame = renderFrame;

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
boot().then(() => {
  if (params.has('render')) { renderFrame(+params.get('t') || 0); return; }
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = true, t0 = performance.now(), cur = 0;
  const setT = t => { cur = t; t0 = performance.now() - t * 1000; };
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'PAUSE' : 'PLAY'; if (playing) setT(cur); };
  scrub.oninput = () => { setT(+scrub.value); renderFrame(cur); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });
  (function loop(now) {
    if (playing) { cur = ((now - t0) / 1000) % DUR; scrub.value = cur; }
    renderFrame(cur);
    tc.textContent = cur.toFixed(2).padStart(5, '0') + ' / 15.00';
    requestAnimationFrame(loop);
  })(performance.now());
});
