<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くらしの手 リッチメニュー（2500×1686）</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#DB8C88; --pink-d:#C4716D; --pink-l:#F7E6E3; --cream:#FFFBF8; --brown:#7A5A45; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:2500px; height:1686px; font-family:"Zen Kaku Gothic New",sans-serif; color:var(--brown); }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); width:100%; height:100%; gap:8px; background:#EBCFCB; }
  .cell{ background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .cell.main{ background:var(--pink); color:#fff; }
  .ic{ width:200px; height:200px; border-radius:50%; background:var(--pink-l); display:grid; place-items:center; margin-bottom:44px; }
  .main .ic{ background:rgba(255,255,255,.22); }
  .ic svg{ width:104px; height:104px; fill:none; stroke:var(--pink-d); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .main .ic svg{ stroke:#fff; }
  .t{ font-family:"Shippori Mincho",serif; font-weight:600; font-size:96px; letter-spacing:.1em; }
  .s{ font-size:52px; margin-top:16px; letter-spacing:.06em; color:#A88878; }
  .main .s{ color:#FFF1EE; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell main">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg></div>
    <div class="t">予約・相談</div><div class="s">ひと言からどうぞ</div>
  </div>
  <div class="cell">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
    <div class="t">料金・メニュー</div><div class="s">プランと料金</div>
  </div>
  <div class="cell">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg></div>
    <div class="t">できること</div><div class="s">掃除・片づけ・生前整理</div>
  </div>
  <div class="cell">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></div>
    <div class="t">はじめての方へ</div><div class="s">ご利用の流れ</div>
  </div>
  <div class="cell">
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
    <div class="t">代表紹介</div><div class="s">資格と想い</div>
  </div>
  <div class="cell">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg></div>
    <div class="t">片づけブログ</div><div class="s">暮らしのヒント</div>
  </div>
</div>
</body>
</html>
