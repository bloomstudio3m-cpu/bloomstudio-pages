<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くらしの手 名刺（91×55mm）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ピンク指定パレット（ロゴ案から抽出） */
  :root{ --pink:#DB8C88; --pink-d:#C4716D; --pink-l:#F7E6E3; --cream:#FFFBF8; --brown:#7A5A45; --sub:#9A8576; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#EDE7E3; font-family:"Zen Kaku Gothic New",sans-serif; color:var(--brown); padding:10mm; display:flex; flex-wrap:wrap; gap:10mm; justify-content:center; }
  .card{ width:91mm; height:55mm; position:relative; overflow:hidden; box-shadow:0 2mm 6mm rgba(0,0,0,.12); }
  .label{ width:100%; text-align:center; font-size:11px; color:#888; margin-bottom:-6mm; }

  /* 表 */
  .front{ background:#FFFFFF; display:grid; grid-template-columns:30mm 1fr; align-items:center; padding:5mm 6mm 5mm 4mm; gap:3mm; }
  .front::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:1.6mm; background:var(--pink); }
  .f-logo img{ width:30mm; height:30mm; object-fit:contain; display:block; }
  .f-main .role{ font-size:2mm; color:var(--sub); letter-spacing:.08em; line-height:1.6; }
  .f-main .nm{ font-family:"Shippori Mincho",serif; font-weight:600; font-size:5mm; letter-spacing:.22em; margin-top:.8mm; color:var(--brown); }
  .f-main .ro{ font-size:2mm; letter-spacing:.2em; color:var(--pink-d); margin-top:.2mm; }
  .f-main .info{ margin-top:3mm; padding-top:2.2mm; border-top:.2mm solid var(--pink-l); font-size:2mm; line-height:1.8; letter-spacing:.03em; }
  .f-main .info b{ display:inline-block; width:8mm; color:var(--pink-d); font-weight:500; }

  /* 裏 */
  .back{ background:var(--pink); color:#fff; display:grid; grid-template-columns:1fr 20mm; gap:4mm; padding:6.5mm; align-items:center; }
  .b-copy .shop{ font-family:"Shippori Mincho",serif; font-weight:600; font-size:3.4mm; letter-spacing:.2em; }
  .b-copy .shop small{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:400; font-size:2mm; letter-spacing:.1em; margin-left:1.5mm; }
  .b-copy h2{ font-family:"Shippori Mincho",serif; font-weight:500; font-size:3.9mm; letter-spacing:.12em; line-height:1.7; margin:2.4mm 0 2.4mm; }
  .b-copy ul{ list-style:none; font-size:2.1mm; line-height:1.9; }
  .b-copy li::before{ content:"・"; }
  .b-copy .area{ font-size:1.9mm; margin-top:1.6mm; opacity:.92; letter-spacing:.04em; }
  .b-qr{ text-align:center; }
  .b-qr .qr{ width:20mm; height:20mm; background:#fff; border-radius:1.5mm; display:grid; place-items:center; color:var(--pink-d); font-size:2mm; line-height:1.4; }
  .b-qr p{ font-size:1.9mm; margin-top:1.4mm; line-height:1.5; letter-spacing:.04em; }

  @media print{
    @page{ size:91mm 55mm; margin:0; }
    body{ background:none; padding:0; display:block; }
    .label{ display:none; }
    .card{ box-shadow:none; page-break-after:always; }
  }
</style>
</head>
<body>

<div class="label">表面（ロゴはD案の仮置き）</div>
<div class="card front" id="front">
  <div class="f-logo"><img src="assets/logo_kurashinote_round_transparent.png" alt="くらしの手"></div>
  <div class="f-main">
    <div class="role">代表<br>整理収納アドバイザー1級／終活アドバイザー</div>
    <div class="nm">【代表者名】</div>
    <div class="ro">【ROMAJI NAME】</div>
    <div class="info">
      <b>TEL</b>000-0000-0000<br>
      <b>LINE</b>@xxxxxxx<br>
      <b>WEB</b>politeliving2022.com
    </div>
  </div>
</div>

<div class="label">裏面</div>
<div class="card back" id="back">
  <div class="b-copy">
    <div class="shop">くらしの手<small>家事代行と片づけ</small></div>
    <h2>暮らしに、<br>そっと手を添える。</h2>
    <ul>
      <li>お掃除・水まわり</li>
      <li>整理収納・片づけ</li>
      <li>生前整理・実家の片づけ</li>
    </ul>
    <div class="area">対応：富士・富士宮・三島・沼津・御殿場</div>
  </div>
  <div class="b-qr">
    <div class="qr">LINE<br>QRコード</div>
    <p>ご予約・ご相談は<br>LINEから</p>
  </div>
</div>

</body>
</html>
